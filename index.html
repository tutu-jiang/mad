<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>【极乐事件簿】节奏榜编辑器</title>
  <meta name="description" content="极乐事件簿节奏榜编辑器，可拖拽角色头像排序并保存为图片。" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
  <style>
    :root {
      --bg: #0d1729;
      --panel: #111d31;
      --panel-strong: #17243a;
      --line: #2a3b55;
      --line-soft: rgba(117, 153, 198, 0.25);
      --text: #eef7ff;
      --muted: #8ea5c4;
      --cyan: #16d9ff;
      --cyan-dark: #0898bf;
      --button: #2b3e59;
      --shadow: rgba(0, 0, 0, 0.35);
      --avatar-size: 86px;
      --avatar-gap: 12px;
      --star-size: 18px;
      --tier-label-width: 100px;
      --tier-row-min-height: 124px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(30, 90, 140, 0.22), transparent 32rem),
        linear-gradient(180deg, #0b1425 0%, var(--bg) 42%, #081120 100%);
    }

    a {
      color: var(--cyan);
      text-decoration: none;
      transition: color 0.18s ease;
    }

    a:hover {
      color: #71efff;
      text-decoration: underline;
    }

    button,
    label.upload-card {
      font: inherit;
      cursor: pointer;
      user-select: none;
    }

    .page {
      width: min(1120px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 18px 0 32px;
    }

    .hero {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 16px;
      align-items: start;
      margin-bottom: 18px;
    }

    .game-icon {
      max-width: 145px;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 18px var(--shadow));
    }

    .footer-info {
      grid-template-columns: 150px minmax(0, 1fr) 240px;
      align-items: center;
      margin-top: 24px;
      margin-bottom: 0;
    }

    .team-logo-link {
      display: block;
      width: 240px;
      max-width: 100%;
      justify-self: end;
      transition: transform 0.18s ease;
    }

    .team-logo-link:hover {
      transform: translateY(-2px);
    }

    .team-logo-link img {
      display: block;
      width: 100%;
      height: auto;
    }

    .link-list {
      display: grid;
      gap: 12px;
      padding-top: 6px;
      font-size: 16px;
      line-height: 1.5;
    }

    .qq-link {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 1px 10px;
      border-radius: 4px;
      background: rgba(16, 42, 68, 0.85);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
      padding: 0 16px 15px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 4px;
      color: var(--cyan);
      font-size: clamp(28px, 4vw, 34px);
      line-height: 1.25;
      text-shadow: 0 0 18px rgba(22, 217, 255, 0.18);
    }

    .tips {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      min-width: 62px;
      border: 0;
      border-radius: 4px;
      padding: 10px 18px;
      color: #fff;
      background: var(--button);
      font-weight: 700;
      transition: transform 0.16s ease, filter 0.16s ease, background 0.16s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .btn.primary {
      background: linear-gradient(135deg, #13bae4, var(--cyan-dark));
    }

    .tier-board {
      padding: 20px;
      border: 1px solid #293a53;
      border-radius: 20px;
      background: linear-gradient(135deg, #111f33, #111a2d 60%, #151b30);
      box-shadow: 0 16px 48px rgba(3, 12, 28, 0.2);
    }

    .board-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 16px;
      color: #dce8f8;
    }

    .board-heading strong {
      font-size: 16px;
      letter-spacing: 1px;
    }

    .board-heading span {
      color: #8a9cb7;
      font-size: 12px;
    }

    .tier-row {
      display: grid;
      grid-template-columns: var(--tier-label-width) minmax(0, 1fr);
      min-height: var(--tier-row-min-height);
      position: relative;
      margin-bottom: 10px;
      border: 1px solid rgba(var(--tier-rgb), 0.2);
      border-radius: 14px;
      overflow: hidden;
      background: #101d30;
      box-shadow: 0 2px 8px rgba(61, 56, 98, 0.03);
    }

    .tier-row[data-tier="t0"] { --tier-rgb: 230, 97, 139; --tier-ink: #f395b6; }
    .tier-row[data-tier="t05"] { --tier-rgb: 156, 126, 221; --tier-ink: #c4acf4; }
    .tier-row[data-tier="t1"] { --tier-rgb: 89, 163, 217; --tier-ink: #91c8ee; }
    .tier-row[data-tier="t2"] { --tier-rgb: 85, 175, 169; --tier-ink: #89d2cb; }
    .tier-row[data-tier="t3"] { --tier-rgb: 139, 149, 176; --tier-ink: #b2bfd8; }

    .tier-row:last-of-type {
      margin-bottom: 0;
    }

    .tier-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: var(--tier-row-min-height);
      border-left: 4px solid rgba(var(--tier-rgb), 0.75);
      color: var(--tier-ink);
      background: linear-gradient(135deg, rgba(var(--tier-rgb), 0.18), rgba(var(--tier-rgb), 0.06));
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .tier-label::before {
      content: "TIER";
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 3px;
      opacity: 0.65;
    }

    .tier-label::after {
      content: "";
      width: 20px;
      height: 2px;
      border-radius: 2px;
      background: rgba(var(--tier-rgb), 0.55);
    }

    .drop-zone {
      display: flex;
      align-content: flex-start;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: var(--avatar-gap);
      min-height: var(--tier-row-min-height);
      padding: 10px;
      background: rgba(18, 30, 50, 0.72);
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    .drop-zone.drag-over {
      background: rgba(18, 72, 99, 0.42);
      box-shadow: inset 0 0 0 2px rgba(22, 217, 255, 0.46);
    }

    .tier-row .drop-zone {
      align-items: flex-start;
      padding: 12px;
      background: linear-gradient(90deg, rgba(var(--tier-rgb), 0.045), rgba(var(--tier-rgb), 0.01));
    }

    .tier-row .drop-zone:empty {
      align-content: center;
    }

    .tier-row .drop-zone:empty::after {
      content: "拖入角色";
      align-self: center;
      margin: auto;
      color: #71839f;
      font-size: 12px;
      letter-spacing: 2px;
      pointer-events: none;
    }

    .tier-row .drop-zone.drag-over {
      background: rgba(var(--tier-rgb), 0.12);
      box-shadow: inset 0 0 0 2px rgba(var(--tier-rgb), 0.5);
    }

    .watermark {
      margin: 10px 0 0;
      color: #71809b;
      font-size: 10px;
      letter-spacing: 2px;
      text-align: right;
    }

    .pool {
      margin-top: 40px;
      padding: 26px 26px 24px;
      border: 1px dashed rgba(117, 153, 198, 0.38);
      border-radius: 10px;
      background: rgba(13, 25, 43, 0.72);
    }

    .pool-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 18px;
      font-size: 22px;
      line-height: 1.2;
    }

    .pool-title::before {
      content: "";
      width: 8px;
      height: 24px;
      background: var(--cyan);
      box-shadow: 0 0 16px rgba(22, 217, 255, 0.35);
    }

    .character-pool {
      display: flex;
      flex-wrap: wrap;
      gap: var(--avatar-gap);
      min-height: 118px;
    }

    .avatar {
      position: relative;
      flex: none;
      width: var(--avatar-size);
      height: auto;
      border: 2px solid rgba(228, 199, 112, 0.9);
      border-radius: 4px;
      padding: 3px;
      background: linear-gradient(145deg, #55442c, #222c3d 56%, #07101e);
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.32);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: transform 0.16s ease, opacity 0.16s ease, box-shadow 0.16s ease;
    }

    .avatar-portrait {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
    }

    .avatar-name {
      display: block;
      height: 22px;
      padding: 3px 1px 1px;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
      text-align: center;
      color: #f4e8c7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      pointer-events: none;
    }

    .avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      -webkit-touch-callout: none;
    }

    .avatar-stars {
      position: absolute;
      right: 3px;
      bottom: 3px;
      display: flex;
      pointer-events: none;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.85));
    }

    .avatar-stars img {
      display: block;
      width: var(--star-size);
      height: var(--star-size);
    }

    .avatar:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.42), 0 0 0 2px rgba(22, 217, 255, 0.24);
    }

    .avatar.dragging {
      opacity: 0.45;
      transform: scale(0.96);
    }

    .avatar.touch-dragging {
      opacity: 0.35;
    }

    .avatar.touch-drag-preview {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      opacity: 0.9;
      transform: translate(-50%, -50%) scale(1.08);
    }

    .upload-card {
      display: grid;
      place-items: center;
      width: var(--avatar-size);
      height: calc(var(--avatar-size) + 22px);
      border: 2px dashed var(--cyan-dark);
      border-radius: 4px;
      color: #65edff;
      background: rgba(8, 22, 39, 0.72);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .upload-card:hover {
      transform: translateY(-2px);
      border-color: var(--cyan);
      background: rgba(8, 51, 74, 0.78);
    }

    .upload-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 30px;
      line-height: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      :root {
        --avatar-size: 68px;
        --avatar-gap: 9px;
        --star-size: 15px;
        --tier-label-width: 70px;
        --tier-row-min-height: 110px;
      }

      .page {
        width: min(100% - 20px, 1120px);
        padding-top: 12px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .game-icon {
        max-width: 145px;
      }

      .footer-info {
        grid-template-columns: minmax(0, 0.72fr) minmax(0, 1.28fr);
        gap: 14px;
      }

      .footer-info .game-icon {
        grid-column: 1;
        grid-row: 1;
      }

      .footer-info .link-list {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .footer-info .team-logo-link {
        grid-column: 2;
        grid-row: 1;
        width: 220px;
      }

      .character-pool {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        padding: 0;
      }

      .character-pool .avatar {
        width: 100%;
      }

      .character-pool .avatar-name {
        font-size: 11px;
      }

      .character-pool .avatar-stars img {
        width: clamp(11px, 3.6vw, 15px);
        height: clamp(11px, 3.6vw, 15px);
      }

      .character-pool .upload-card {
        width: 100%;
        height: auto;
        aspect-ratio: 68 / 90;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
        padding-inline: 0;
      }

      .actions {
        justify-content: flex-start;
      }

      .tier-board,
      .pool {
        padding: 10px;
      }

      .tier-label {
        font-size: 22px;
        gap: 6px;
      }

      .tier-board {
        border-radius: 16px;
        padding: 14px 10px;
      }

      .board-heading {
        margin-bottom: 12px;
      }

      .board-heading strong {
        font-size: 14px;
      }

      .board-heading span {
        font-size: 10px;
      }

      .tier-row .drop-zone {
        padding: 9px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="toolbar" aria-label="节奏榜操作区">
      <div>
        <h1>【极乐事件簿】节奏榜编辑器</h1>
        <p class="tips">拖拽头像进行排序，如角色缺失可自行添加头像</p>
      </div>
      <div class="actions">
        <button class="btn" type="button" id="resetBtn">重置</button>
        <button class="btn primary" type="button" id="saveBtn">保存为图片</button>
      </div>
    </section>

    <section class="tier-board" id="captureArea" aria-label="节奏榜画布">
      <div class="board-heading"><strong>角色强度排行</strong><span>拖入角色 · 自由排序</span></div>
      <div class="tier-row" data-tier="t0">
        <div class="tier-label t0">T0</div>
        <div class="drop-zone" data-zone="t0" aria-label="T0 分区"></div>
      </div>
      <div class="tier-row" data-tier="t05">
        <div class="tier-label t05">T0.5</div>
        <div class="drop-zone" data-zone="t05" aria-label="T0.5 分区"></div>
      </div>
      <div class="tier-row" data-tier="t1">
        <div class="tier-label t1">T1</div>
        <div class="drop-zone" data-zone="t1" aria-label="T1 分区"></div>
      </div>
      <div class="tier-row" data-tier="t2">
        <div class="tier-label t2">T2</div>
        <div class="drop-zone" data-zone="t2" aria-label="T2 分区"></div>
      </div>
      <div class="tier-row" data-tier="t3">
        <div class="tier-label t3">T3</div>
        <div class="drop-zone" data-zone="t3" aria-label="T3 分区"></div>
      </div>
      <p class="watermark">MAKE DRAMA · TIER LIST</p>
    </section>

    <section class="pool" aria-label="角色池">
      <h2 class="pool-title">角色池</h2>
      <div class="character-pool drop-zone" id="characterPool" data-zone="pool"></div>
    </section>

    <footer class="hero footer-info" aria-label="极乐事件簿节奏榜编辑器信息">
      <img class="game-icon" src="img/icon.png" alt="极乐事件簿" />
      <div class="link-list">
        <div>极乐事件簿 X GameKee 攻略网站： <a href="https://www.gamekee.com/mad/" target="_blank" rel="noopener noreferrer">www.gamekee.com/mad/</a></div>
        <div>玩家QQ群： <a class="qq-link" href="http://qm.qq.com/cgi-bin/qm/qr?_wv=1027&amp;k=h0mc3L2wSvfbTpddyo1BPLEUJjv4oecv&amp;authKey=UwQugUd8nFOaaAgMgwSyobQCmSUHH4rtcPi51%2BXb9gb97lZqoGFlbLU%2FloYiw7k3&amp;noverify=0&amp;group_code=806779419" target="_blank" rel="noopener noreferrer">806779419</a></div>
      </div>
      <a class="team-logo-link" href="https://www.gamekee.com/mad/708109.html" target="_blank" rel="noopener noreferrer" aria-label="极乐攻略组">
        <img src="img/logo.png" alt="极乐攻略组" />
      </a>
    </footer>
  </main>

    <label class="upload-card" for="avatarUpload">
      <span><strong>+</strong>上传头像</span>
    </label>
  </template>
  <input class="sr-only" id="avatarUpload" type="file" accept="image/*" multiple />

      {"name": "露米娜", "src": "img/露米娜.webp", "stars": 1}
    ];
    const characterPool = document.querySelector('#characterPool');
    const uploadInput = document.querySelector('#avatarUpload');
    const uploadTemplate = document.querySelector('#uploadTemplate');
    const zones = Array.from(document.querySelectorAll('.drop-zone'));
    let draggedAvatar = null;
    let touchDrag = null;
    let uploadedIndex = 0;

    function createAvatar(src, name, starCount = 0) {
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.dataset.stars = String(starCount);
      avatar.setAttribute('role', 'img');
      avatar.setAttribute('aria-label', starCount ? `${name}，${starCount}星` : name);
      avatar.draggable = true;
      const portraitFrame = document.createElement('div');
      portraitFrame.className = 'avatar-portrait';
      const portrait = document.createElement('img');
      portrait.className = 'avatar-image';
      portrait.src = src;
      portrait.alt = '';
      portrait.draggable = false;
      portrait.loading = 'eager';
      portrait.decoding = 'async';
      portraitFrame.appendChild(portrait);
      avatar.appendChild(portraitFrame);
      if (starCount) {
        const stars = document.createElement('span');
        stars.className = 'avatar-stars';
        stars.setAttribute('aria-hidden', 'true');
        for (let i = 0; i < starCount; i += 1) {
          const star = document.createElement('img');
          star.src = 'img/start.webp';
          star.alt = '';
          stars.appendChild(star);
        }
        portraitFrame.appendChild(stars);
      }
      const label = document.createElement('span');
      label.className = 'avatar-name';
      label.textContent = name;
      avatar.appendChild(label);
      avatar.addEventListener('dragstart', handleDragStart);
      avatar.addEventListener('dragend', handleDragEnd);
      avatar.addEventListener('pointerdown', handleTouchPointerDown);
      avatar.addEventListener('pointermove', handleTouchPointerMove);
      avatar.addEventListener('pointerup', handleTouchPointerUp);
      avatar.addEventListener('pointercancel', handleTouchPointerCancel);
      avatar.addEventListener('contextmenu', (event) => event.preventDefault());
      return avatar;
    }

    function renderUploadCard() {
      characterPool.appendChild(uploadTemplate.content.firstElementChild.cloneNode(true));
    }

    function renderInitialCharacters() {
      zones.forEach((zone) => zone.replaceChildren());
      CHARACTER_DATA.forEach(({ src, name, stars }) => {
        characterPool.appendChild(createAvatar(src, name, stars));
      });
      renderUploadCard();
    }

    function handleDragStart(event) {
      draggedAvatar = event.currentTarget;
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', draggedAvatar.getAttribute('aria-label'));
      requestAnimationFrame(() => draggedAvatar.classList.add('dragging'));
    }

    function handleDragEnd() {
      if (draggedAvatar) {
        draggedAvatar.classList.remove('dragging');
      }
      draggedAvatar = null;
      zones.forEach((zone) => zone.classList.remove('drag-over'));
    }

    function getTouchDropZone(x, y) {
      const hit = document.elementFromPoint(x, y);
      return hit?.closest('.drop-zone') || hit?.closest('.tier-row')?.querySelector('.drop-zone') || null;
    }

    function updateTouchDrag() {
      if (!touchDrag?.active) return;
      touchDrag.preview.style.left = `${touchDrag.x}px`;
      touchDrag.preview.style.top = `${touchDrag.y}px`;
      const zone = getTouchDropZone(touchDrag.x, touchDrag.y);
      zones.forEach((item) => item.classList.toggle('drag-over', item === zone));
      touchDrag.zone = zone;
    }

    function autoScrollTouchDrag() {
      if (!touchDrag?.active) return;
      const edge = 80;
      const speed = touchDrag.y < edge ? -14 : touchDrag.y > window.innerHeight - edge ? 14 : 0;
      if (speed) {
        window.scrollBy(0, speed);
        updateTouchDrag();
      }
      touchDrag.frame = requestAnimationFrame(autoScrollTouchDrag);
    }

    function startTouchDrag() {
      if (!touchDrag || touchDrag.active) return;
      touchDrag.active = true;
      touchDrag.avatar.classList.add('touch-dragging');
      touchDrag.preview = touchDrag.avatar.cloneNode(true);
      touchDrag.preview.classList.add('touch-drag-preview');
      touchDrag.preview.setAttribute('aria-hidden', 'true');
      document.body.appendChild(touchDrag.preview);
      updateTouchDrag();
      touchDrag.frame = requestAnimationFrame(autoScrollTouchDrag);
    }

    function finishTouchDrag(commit) {
      if (!touchDrag) return;
      const state = touchDrag;
      clearTimeout(state.timer);
      cancelAnimationFrame(state.frame);
      if (state.active) {
        const zone = state.zone;
        if (commit && zone) {
          const beforeElement = getInsertBeforeElement(zone, state.x, state.y);
          const uploadCard = zone.querySelector('.upload-card');
          if (beforeElement) zone.insertBefore(state.avatar, beforeElement);
          else if (uploadCard) zone.insertBefore(state.avatar, uploadCard);
          else zone.appendChild(state.avatar);
        }
        state.preview.remove();
        state.avatar.classList.remove('touch-dragging');
      }
      state.avatar.draggable = true;
      zones.forEach((zone) => zone.classList.remove('drag-over'));
      touchDrag = null;
    }

    function handleTouchPointerDown(event) {
      if (event.pointerType !== 'touch' || touchDrag) return;
      event.preventDefault();
      const avatar = event.currentTarget;
      avatar.draggable = false;
      avatar.setPointerCapture(event.pointerId);
      touchDrag = {
        avatar, pointerId: event.pointerId, x: event.clientX, y: event.clientY,
        startX: event.clientX, startY: event.clientY, active: false,
        timer: setTimeout(startTouchDrag, 200), frame: 0, preview: null, zone: null
      };
    }

    function handleTouchPointerMove(event) {
      if (!touchDrag || event.pointerId !== touchDrag.pointerId) return;
      touchDrag.x = event.clientX;
      touchDrag.y = event.clientY;
      if (!touchDrag.active && Math.hypot(touchDrag.x - touchDrag.startX, touchDrag.y - touchDrag.startY) > 8) {
        clearTimeout(touchDrag.timer);
        startTouchDrag();
      }
      updateTouchDrag();
    }

    function handleTouchPointerUp(event) {
      if (touchDrag?.pointerId === event.pointerId) finishTouchDrag(true);
    }

    function handleTouchPointerCancel(event) {
      if (touchDrag?.pointerId === event.pointerId) finishTouchDrag(false);
    }

    function getInsertBeforeElement(zone, x, y) {
      const draggableAvatars = [...zone.querySelectorAll('.avatar:not(.dragging):not(.touch-dragging)')];
      return draggableAvatars.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offsetY = y - box.top - box.height / 2;
        const offsetX = x - box.left - box.width / 2;
        const score = Math.abs(offsetY) * 2 + Math.abs(offsetX);
        if (offsetY < box.height / 2 && offsetX < box.width / 2 && score < closest.score) {
          return { score, element: child };
        }
        return closest;
      }, { score: Number.POSITIVE_INFINITY, element: null }).element;
    }

    zones.forEach((zone) => {
      zone.addEventListener('dragover', (event) => {
        event.preventDefault();
        zone.classList.add('drag-over');
        if (!draggedAvatar) return;
        const beforeElement = getInsertBeforeElement(zone, event.clientX, event.clientY);
        const uploadCard = zone.querySelector('.upload-card');
        if (beforeElement) {
          zone.insertBefore(draggedAvatar, beforeElement);
        } else if (uploadCard) {
          zone.insertBefore(draggedAvatar, uploadCard);
        } else {
          zone.appendChild(draggedAvatar);
        }
      });

      zone.addEventListener('dragleave', (event) => {
        if (!zone.contains(event.relatedTarget)) {
          zone.classList.remove('drag-over');
        }
      });

      zone.addEventListener('drop', (event) => {
        event.preventDefault();
        zone.classList.remove('drag-over');
      });
    });

    uploadInput.addEventListener('change', (event) => {
      [...event.target.files].forEach((file) => {
        if (!file.type.startsWith('image/')) return;
        uploadedIndex += 1;
        const avatar = createAvatar(URL.createObjectURL(file), file.name.replace(/\.[^.]+$/, "") || `上传头像 ${uploadedIndex}`);
        const uploadCard = characterPool.querySelector('.upload-card');
        characterPool.insertBefore(avatar, uploadCard);
      });
      uploadInput.value = '';
    });

    document.querySelector('#resetBtn').addEventListener('click', () => {
      if (confirm('确定要重置节奏榜吗？当前排序会被清空。')) {
        renderInitialCharacters();
      }
    });

    document.querySelector('#saveBtn').addEventListener('click', async () => {
      const saveButton = document.querySelector('#saveBtn');
      const captureArea = document.querySelector('#captureArea');
      if (!window.html2canvas) {
        alert('图片保存组件仍在加载，请稍后再试。');
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = '生成中...';
      try {
        await Promise.all([...captureArea.querySelectorAll('img')].map((img) => img.decode().catch(() => {})));
        const canvas = await html2canvas(captureArea, {
          backgroundColor: '#0d1729',
          scale: Math.min(window.devicePixelRatio || 1, 2),
          useCORS: true,
          allowTaint: true
        });
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('无法生成图片文件');
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = '极乐事件簿-节奏榜.png';
        link.href = url;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (error) {
        console.error(error);
        alert('保存图片失败，请刷新页面后重试。');
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = '保存为图片';
      }
    });

    renderInitialCharacters();
  </script>
</body>
</html>
